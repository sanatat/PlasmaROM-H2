name: Manual local CPU scaling (NOT HPC evidence)

on:
  workflow_dispatch:

jobs:
  scaling-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - name: Run explicit multiprocessing checks
        run: python -m pytest -q tests/test_v6_scaling.py
